<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      * {
        border: 1px red dashed;
      }

      html {
        min-height:100%;
      }

      body{
        min-height: 100%;
        padding-top: 40px;
        padding-bottom: 40px;
        background: linear-gradient(165deg, #ffc7c7, #e6afb8, #cc99a9, #b38399, #9a6e89, #815a78, #694767, #523456);
        color: rgba(255,255,255,1.0);
      }

      a{
        color: rgba(255,255,255,1.0);
      }

      .avatar-image {
        width: 128px;
        height: 128px;
        object-fit: cover;
        border-radius: 128px;
      }

      .thumbnail {
        width:48 px;
        height: 48px;
        object-fit: cover;
        border-radius: 48px;
      }

      .item{
        background-color: rgba(149,123,173,0.5);
      }

      .main-container {
        max-width: 640px;
        margin: auto;
      }

      .image-row {
        margin-bottom: 20px;
        text-align: center;
      }

      .name-row {
        margin-bottom: 30px;
        text-align: center;
      }

      .social-icons-row {
        margin-bottom: 30px;
        display: flex;
        justify-content: space-around;
      }

      .item {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
      }

      .link-text{
        text-align: center;
        flex-grow: 1;
      }
    </style>

    <title>KTC's links</title>

  </head>

  <body>
    <div class = "main-container">

        </a>

        </a>

      <div class = "links-row">

      </div> <!--links row-->
    </div> <!-- main container-->

</html>
